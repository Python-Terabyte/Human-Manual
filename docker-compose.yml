version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hm_user
      POSTGRES_PASSWORD: hm_password
      POSTGRES_DB: human_manual
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hm_user -d human_manual"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: hm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
